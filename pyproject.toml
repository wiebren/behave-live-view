[build-system]
requires = ["setuptools >= 64.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "behave-live-view"
description = "Interactive live view of a behave test run: navigable status lines, step details, rerun"
readme = "README.md"
license = {text = "BSD-2-Clause"}
authors = [{name = "Wiebren Braakman"}]
keywords = ["behave", "BDD", "testing", "formatter", "TUI", "textual"]
requires-python = ">=3.10"
dependencies = [
    # -- HINT: behave v1.4.0 is needed; its development version is accepted
    # (until v1.4.0 is released: install behave from its repository).
    "behave >= 1.4.0.dev0",
    "textual >= 1.0",
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: BDD",
]

[project.urls]
Homepage = "https://github.com/wiebren/behave-live-view"
Issues = "https://github.com/wiebren/behave-live-view/issues"

[project.optional-dependencies]
testing = ["pytest >= 7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "behave_live_view.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
