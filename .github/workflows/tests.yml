name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # -- HINT: behave v1.4.0 is not released yet (needed: behave >= 1.4.0).
      # -- HINT: behave-parallel-runner is used by the tests of parallel runs.
      - name: Install package (with the development version of behave)
        run: >
          python -m pip install -e ".[testing]"
          "behave @ git+https://github.com/behave/behave@main"
          "behave-parallel-runner @ git+https://github.com/wiebren/behave-parallel-runner@main"
      - name: Run tests
        run: python -m pytest
